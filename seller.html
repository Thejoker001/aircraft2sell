<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aircraft2Sell — Profil vendeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e8a020">
<style>
:root{--bg:#05080f;--deep:#030610;--surface:#0a1020;--card:#0c1428;--card2:#0f1830;--border:rgba(180,200,230,.08);--border2:rgba(180,200,230,.14);--accent:#e8a020;--gold:#f5c518;--mist:#7a93aa;--mist2:#3d5468;--white:#edf2f8;--dim:#c8d8e8;--green:#22c55e;--red:#ef4444;--blue:#3b82f6}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}

/* ── NAV ── */
nav{position:sticky;top:0;z-index:300;height:60px;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;background:rgba(3,6,16,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:.12em;color:var(--white);text-decoration:none}
.logo span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:.6rem}
.btn-back{background:transparent;border:1px solid var(--border2);color:var(--mist);padding:.38rem .9rem;font-family:'DM Sans',sans-serif;font-size:.74rem;text-decoration:none;transition:all .2s}
.btn-back:hover{color:var(--white)}
.btn-post{background:var(--accent);color:var(--deep);border:none;padding:.42rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:.74rem;font-weight:700;text-decoration:none;cursor:pointer;transition:background .2s}
.btn-post:hover{background:var(--gold)}

/* ── PAGE ── */
.page-wrap{max-width:1100px;margin:0 auto;padding:2rem;display:grid;grid-template-columns:300px 1fr;gap:2rem;align-items:start}

/* ── PROFIL CARD ── */
.profile-card{background:var(--card);border:1px solid var(--border2);position:sticky;top:80px}
.profile-hero{background:linear-gradient(135deg,rgba(13,28,56,.9),rgba(8,18,38,.8));padding:2rem 1.5rem;text-align:center;border-bottom:1px solid var(--border)}
.profile-avatar{width:80px;height:80px;background:rgba(232,160,32,.12);border:2px solid rgba(232,160,32,.3);border-radius:0;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--accent);margin:0 auto 1rem;flex-shrink:0}
.profile-name{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:.06em;line-height:1;margin-bottom:.3rem}
.profile-pseudo{font-size:.78rem;color:var(--mist);margin-bottom:.75rem}
.badges{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-bottom:.75rem}
.badge{font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .65rem;display:inline-flex;align-items:center;gap:.3rem}
.badge-verified{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:var(--green)}
.badge-verified::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--green)}
.badge-plan{background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.25);color:var(--accent)}
.badge-pro{background:rgba(168,139,250,.1);border:1px solid rgba(168,139,250,.25);color:#a78bfa}
.profile-since{font-size:.68rem;color:var(--mist2)}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.ps-item{background:var(--card);padding:.85rem;text-align:center}
.ps-val{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--accent);line-height:1}
.ps-label{font-size:.56rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mist2);margin-top:.2rem}
.profile-info{padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.1rem}
.pi-row{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.78rem}
.pi-row:last-child{border-bottom:none;padding-bottom:0}
.pi-icon{font-size:.9rem;width:18px;text-align:center;flex-shrink:0}
.pi-val{color:var(--dim)}
.pi-val a{color:var(--accent);text-decoration:none}
.pi-val a:hover{text-decoration:underline}

/* Rating stars */
.stars{display:flex;gap:2px;justify-content:center;margin-bottom:.5rem}
.star{font-size:1.1rem;color:rgba(200,220,240,.15)}
.star.on{color:var(--gold)}

/* Contact btn */
.btn-contact-seller{display:block;width:100%;background:var(--accent);color:var(--deep);border:none;padding:.85rem;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;cursor:pointer;transition:background .2s;text-align:center;text-decoration:none;margin-top:.1rem}
.btn-contact-seller:hover{background:var(--gold)}

/* ── ANNONCES SECTION ── */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:.06em}
.section-title em{color:var(--accent);font-style:normal}
.count-badge{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(232,160,32,.1);border:1px solid rgba(232,160,32,.2);color:var(--accent);padding:.2rem .6rem}

/* ── FILTER TABS ── */
.cat-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:1.25rem}
.cat-tab{background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--mist);padding:.32rem .8rem;font-family:'DM Sans',sans-serif;font-size:.7rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.cat-tab:hover{color:var(--white)}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:var(--deep);font-weight:700}

/* ── LISTING CARDS ── */
.listings-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.lcard{background:var(--card);display:grid;grid-template-columns:120px 1fr auto;cursor:pointer;transition:background .15s}
.lcard:hover{background:var(--card2)}
.lcard-img{aspect-ratio:16/9;background:linear-gradient(135deg,var(--surface),rgba(13,40,71,.6));display:flex;align-items:center;justify-content:center;font-size:2rem;opacity:.25;overflow:hidden;position:relative}
.lcard-img img{width:100%;height:100%;object-fit:cover;opacity:1;position:absolute;inset:0}
.lcard-body{padding:.8rem 1rem;min-width:0}
.lcard-cat{font-size:.56rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.lcard-title{font-size:.88rem;font-weight:600;color:var(--white);margin-bottom:.3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard-meta{font-size:.66rem;color:var(--mist2);display:flex;gap:.5rem;flex-wrap:wrap}
.lcard-side{padding:.8rem .9rem;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;border-left:1px solid var(--border);min-width:110px}
.lcard-price{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;color:var(--gold);letter-spacing:.04em}
.pill{font-size:.54rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.15rem .5rem}
.p-live{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.p-pend{background:rgba(232,160,32,.1);color:var(--accent);border:1px solid rgba(232,160,32,.2)}

/* ── EMPTY ── */
.empty{text-align:center;padding:3rem 1rem;background:var(--card);border:1px solid var(--border)}
.empty-ic{font-size:2.5rem;opacity:.08;margin-bottom:.75rem}
.empty-t{font-size:.84rem;font-weight:600;color:var(--white);margin-bottom:.3rem}
.empty-s{font-size:.72rem;color:var(--mist);line-height:1.6}

/* ── SKELETON ── */
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.6s infinite}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--card2);border:1px solid var(--border2);color:var(--white);padding:.75rem 1.3rem;font-size:.8rem;z-index:999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}

/* ── MODAL CONTACT ── */
.msg-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);z-index:800;align-items:center;justify-content:center;padding:1.5rem}
.msg-overlay.open{display:flex}
.msg-box{background:var(--card);border:1px solid var(--border2);width:100%;max-width:480px}
.msg-head{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--border)}
.msg-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.06em}
.msg-close{background:none;border:none;color:var(--mist);font-size:1.1rem;cursor:pointer;line-height:1;transition:color .15s}
.msg-close:hover{color:var(--accent)}
.msg-body{padding:1.4rem}
.fld{margin-bottom:1rem}
.fld label{display:block;font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mist2);margin-bottom:.38rem}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--white);font-family:'DM Sans',sans-serif;font-size:.87rem;padding:.7rem 1rem;outline:none;transition:border-color .2s}
.inp:focus{border-color:rgba(232,160,32,.5)}
.inp::placeholder{color:var(--mist2)}
textarea.inp{resize:vertical;min-height:100px;line-height:1.6}
.btn-send{width:100%;background:var(--accent);color:var(--deep);border:none;padding:.85rem;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;cursor:pointer;transition:background .2s;margin-top:.25rem}
.btn-send:hover{background:var(--gold)}

/* ── RESPONSIVE ── */
@media(max-width:900px){.page-wrap{grid-template-columns:1fr}.profile-card{position:static}}
@media(max-width:600px){nav{padding:0 1rem}.page-wrap{padding:1.25rem}.lcard{grid-template-columns:80px 1fr auto}}
@media(max-width:480px){.lcard{grid-template-columns:1fr}.lcard-side{border-left:none;border-top:1px solid var(--border);flex-direction:row;align-items:center}.lcard-img{display:none}}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="homepage.html" class="logo">Aircraft2<span>Sell</span></a>
  <div class="nav-right">
    <a href="search.html" class="btn-back">← Annonces</a>
    <a href="post-listing.html" class="btn-post">+ Déposer</a>
  </div>
</nav>

<!-- PAGE -->
<div class="page-wrap">

  <!-- SIDEBAR PROFIL -->
  <aside>
    <div class="profile-card">
      <div class="profile-hero">
        <div class="profile-avatar" id="sellerAvatar">?</div>
        <div class="stars" id="sellerStars">
          <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
        </div>
        <div class="profile-name" id="sellerName">Chargement…</div>
        <div class="profile-pseudo" id="sellerPseudo"></div>
        <div class="badges" id="sellerBadges"></div>
        <div class="profile-since" id="sellerSince"></div>
      </div>
      <div class="profile-stats">
        <div class="ps-item"><div class="ps-val" id="statListings">—</div><div class="ps-label">Annonces</div></div>
        <div class="ps-item"><div class="ps-val" id="statViews">—</div><div class="ps-label">Vues total</div></div>
      </div>
      <div class="profile-info" id="sellerInfo"></div>
      <div style="padding:.75rem 1rem;border-top:1px solid var(--border)">
        <button class="btn-contact-seller" onclick="openContact()">✉ Contacter ce vendeur</button>
      </div>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <main>
    <div class="section-hd">
      <div class="section-title">Annonces de <em id="sellerNameTitle">ce vendeur</em></div>
      <div class="count-badge" id="listingCount">0 annonce</div>
    </div>
    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab active" data-cat="" onclick="filterCat(this,'')">Toutes</button>
      <button class="cat-tab" data-cat="light" onclick="filterCat(this,'light')">Avions légers</button>
      <button class="cat-tab" data-cat="jet" onclick="filterCat(this,'jet')">Jets</button>
      <button class="cat-tab" data-cat="turbo" onclick="filterCat(this,'turbo')">Turboprops</button>
      <button class="cat-tab" data-cat="heli" onclick="filterCat(this,'heli')">Hélicoptères</button>
      <button class="cat-tab" data-cat="ulm" onclick="filterCat(this,'ulm')">ULM</button>
      <button class="cat-tab" data-cat="airliner" onclick="filterCat(this,'airliner')">Avions de ligne</button>
    </div>
    <div id="listingsWrap">
      <div class="listings-list">
        <div class="lcard" style="cursor:default">
          <div class="lcard-img skel"></div>
          <div class="lcard-body" style="padding:1rem">
            <div class="skel" style="height:9px;width:35%;margin-bottom:.6rem;border-radius:2px"></div>
            <div class="skel" style="height:14px;width:70%;margin-bottom:.5rem;border-radius:2px"></div>
            <div class="skel" style="height:9px;width:50%;border-radius:2px"></div>
          </div>
          <div class="lcard-side"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL CONTACT -->
<div class="msg-overlay" id="msgOverlay" onclick="if(event.target===this)closeContact()">
  <div class="msg-box">
    <div class="msg-head">
      <div class="msg-title">Contacter le vendeur</div>
      <button class="msg-close" onclick="closeContact()">✕</button>
    </div>
    <div class="msg-body">
      <div id="msgAlert" style="display:none;padding:.6rem .9rem;font-size:.78rem;margin-bottom:1rem"></div>
      <div class="fld"><label>Votre nom</label><input type="text" class="inp" id="msgName" placeholder="Jean Dupont" autocomplete="name"></div>
      <div class="fld"><label>Votre email</label><input type="email" class="inp" id="msgEmail" placeholder="vous@email.com" autocomplete="email"></div>
      <div class="fld"><label>Message</label><textarea class="inp" id="msgText" placeholder="Bonjour, je souhaite vous contacter au sujet de vos annonces…"></textarea></div>
      <button class="btn-send" onclick="sendContact()">Envoyer le message</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var SB='https://hlivysnlzlqdjcigqgvk.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsaXZ5c25semxxZGpjaWdxZ3ZrIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NDIyMjA3MCwiZXhwIjoyMDg5Nzk4MDcwfQ.Vq4C7c-bY9T9xZQrmFlHofNkjGVD3wuPl0pghOs1YME';
async function sbGet(t,p){try{var r=await fetch(SB+'/rest/v1/'+t+(p?'?'+p:''),{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});return r.ok?await r.json():[];}catch(e){return[];}}

var CAT_LABELS={light:'Avion léger',jet:"Jet d'affaires",turbo:'Turbopropulseur',heli:'Hélicoptère',ulm:'ULM',airliner:'Avion de ligne'};
var COUNTRY_NAMES={FR:'France',DE:'Allemagne',ES:'Espagne',IT:'Italie',BE:'Belgique',NL:'Pays-Bas',CH:'Suisse',GB:'Royaume-Uni',PT:'Portugal',AT:'Autriche',LU:'Luxembourg',US:'USA',CA:'Canada',AU:'Australie'};
var COUNTRY_FLAGS={FR:'🇫🇷',DE:'🇩🇪',ES:'🇪🇸',IT:'🇮🇹',BE:'🇧🇪',NL:'🇳🇱',CH:'🇨🇭',GB:'🇬🇧',PT:'🇵🇹',AT:'🇦🇹',LU:'🇱🇺',US:'🇺🇸',CA:'🇨🇦',AU:'🇦🇺'};
function countryLabel(code){if(!code)return'';return(COUNTRY_FLAGS[code]||'')+' '+(COUNTRY_NAMES[code]||code);}
function optimizeImg(url,w){if(!url)return null;return url+(url.includes('?')?'&':'?')+'width='+(w||400)+'&quality=80&format=webp';}

var _allListings=[],_sellerEmail='',_sellerName='';

/* ── BOOT ── */
window.addEventListener('DOMContentLoaded',async function(){
  var params=new URLSearchParams(location.search);
  _sellerEmail=params.get('email')||'';
  var sellerNameParam=params.get('name')||'';

  if(!_sellerEmail){
    document.getElementById('listingsWrap').innerHTML='<div class="empty"><div class="empty-ic">✈</div><div class="empty-t">Vendeur introuvable</div><div class="empty-s">Aucun email vendeur spécifié.</div></div>';
    return;
  }

  // Charger profil utilisateur depuis table users
  var userData=await sbGet('users','email=eq.'+encodeURIComponent(_sellerEmail)+'&select=*&limit=1');
  var user=userData&&userData[0]?userData[0]:null;

  // Charger toutes les annonces live du vendeur
  var rows=await sbGet('listings','seller_email=eq.'+encodeURIComponent(_sellerEmail)+'&status=eq.live&order=submitted_at.desc&select=*');
  _allListings=rows||[];

  renderProfile(user,sellerNameParam);
  renderListings(_allListings);
  updateCatTabs();

  // Auth nav
  var loggedIn=localStorage.getItem('a2s_logged_in')==='true';
  var tk=sessionStorage.getItem('a2s_auth_token');
  if(loggedIn||tk){
    var userEmail=sessionStorage.getItem('a2s_auth_token')&&(function(){try{return JSON.parse(atob(sessionStorage.getItem('a2s_auth_token').split('.')[1])).email;}catch(e){return '';}})();
    if(userEmail){document.getElementById('msgEmail').value=userEmail;}
  }
});

/* ── PROFIL ── */
function renderProfile(user,fallbackName){
  var name=(user&&(user.pseudo||user.name))||fallbackName||'Vendeur privé';
  var pseudo=user&&user.pseudo&&user.name&&user.pseudo!==user.name?'@'+user.pseudo:'';
  _sellerName=name;

  // Initiales avatar
  document.getElementById('sellerAvatar').textContent=(name[0]||'V').toUpperCase();
  document.getElementById('sellerName').textContent=name;
  document.getElementById('sellerNameTitle').textContent=name;
  document.title='Aircraft2Sell — Profil de '+name;
  if(pseudo)document.getElementById('sellerPseudo').textContent=pseudo;

  // Date inscription
  var since=user&&user.registered_at
    ?'Membre depuis '+new Date(user.registered_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})
    :(_allListings.length&&_allListings[_allListings.length-1].submitted_at
      ?'Actif depuis '+new Date(_allListings[_allListings.length-1].submitted_at).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})
      :'');
  document.getElementById('sellerSince').textContent=since;

  // Badges
  var badges='';
  var isCertified=user&&user.certified;
  var plan=user&&user.plan;
  if(isCertified)badges+='<span class="badge badge-verified">✓ Vendeur vérifié</span>';
  if(plan==='Pro')badges+='<span class="badge badge-pro">★ Pro</span>';
  else if(plan==='Aviateur')badges+='<span class="badge badge-plan">Aviateur</span>';
  document.getElementById('sellerBadges').innerHTML=badges;

  // Étoiles
  var rating=user&&user.rating?parseInt(user.rating):0;
  document.querySelectorAll('#sellerStars .star').forEach(function(s,i){s.classList.toggle('on',i<rating);});
  if(!rating)document.getElementById('sellerStars').style.display='none';

  // Stats
  var totalViews=_allListings.reduce(function(s,l){return s+(l.views||0);},0);
  document.getElementById('statListings').textContent=_allListings.length;
  document.getElementById('statViews').textContent=totalViews>999?(Math.round(totalViews/100)/10)+'k':totalViews;

  // Infos
  var info='';
  if(user&&user.airport)info+='<div class="pi-row"><span class="pi-icon">📍</span><span class="pi-val">'+esc(user.airport)+'</span></div>';
  else if(_allListings.length&&_allListings[0].airport)info+='<div class="pi-row"><span class="pi-icon">📍</span><span class="pi-val">'+esc(_allListings[0].airport)+'</span></div>';
  // Pays : depuis le profil user, sinon depuis la première annonce
  var countryCode=(user&&user.country)||(_allListings.length&&_allListings[0].country)||'';
  if(countryCode)info+='<div class="pi-row"><span class="pi-icon">🌍</span><span class="pi-val">'+countryLabel(countryCode)+'</span></div>';
  if(user&&user.company)info+='<div class="pi-row"><span class="pi-icon">🏢</span><span class="pi-val">'+esc(user.company)+'</span></div>';
  if(user&&user.phone)info+='<div class="pi-row"><span class="pi-icon">📞</span><span class="pi-val"><a href="tel:'+esc(user.phone)+'">'+esc(user.phone)+'</a></span></div>';
  if(!info)info='<div class="pi-row" style="color:var(--mist2);font-size:.76rem;padding:.75rem 0">Aucune information de profil</div>';
  document.getElementById('sellerInfo').innerHTML=info;
}

/* ── ANNONCES ── */
function renderListings(listings){
  var wrap=document.getElementById('listingsWrap');
  var countEl=document.getElementById('listingCount');
  if(countEl)countEl.textContent=listings.length+' annonce'+(listings.length>1?'s':'');

  if(!listings.length){
    wrap.innerHTML='<div class="empty"><div class="empty-ic">✈</div><div class="empty-t">Aucune annonce active</div><div class="empty-s">Ce vendeur n\'a pas d\'annonce publiée actuellement.</div></div>';
    return;
  }
  wrap.innerHTML='<div class="listings-list">'+listings.map(function(l){
    var sym={EUR:'€',USD:'$',GBP:'£',CHF:'Fr'}[l.currency||'EUR']||'€';
    var pn=l.price&&!isNaN(Number(l.price))?Number(l.price):null;
    var pr=pn?sym+pn.toLocaleString('fr-FR'):'—';
    var title=esc([l.make,l.model,l.year?'('+l.year+')':''].filter(Boolean).join(' ')||'Annonce');
    var cat=CAT_LABELS[l.category]||l.category||'';
    var imgHtml=l.photos&&l.photos[0]
      ?'<img src="'+esc(optimizeImg(l.photos[0],300))+'" alt="'+title+'" loading="lazy">'
      :'✈';
    var meta=[];
    if(l.year)meta.push('📅 '+l.year);
    if(l.hours)meta.push('⏱ '+Number(l.hours).toLocaleString('fr-FR')+'h TT');
    if(l.airport)meta.push('📍 '+esc(l.airport));
    else if(l.country)meta.push(countryLabel(l.country));
    return '<div class="lcard" onclick="window.location.href=\'listing.html?id='+encodeURIComponent(l.id)+'\'">'
      +'<div class="lcard-img">'+imgHtml+'</div>'
      +'<div class="lcard-body">'
      +'<div class="lcard-cat">'+esc(cat)+'</div>'
      +'<div class="lcard-title">'+title+'</div>'
      +'<div class="lcard-meta">'+meta.join('<span style="opacity:.3">·</span>')+'</div>'
      +'</div>'
      +'<div class="lcard-side">'
      +'<div class="lcard-price">'+esc(pr)+'</div>'
      +'<span class="pill p-live">● Live</span>'
      +'</div></div>';
  }).join('')+'</div>';
}

/* ── FILTRES CATÉGORIES ── */
var _currentCat='';
function filterCat(btn,cat){
  _currentCat=cat;
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  var filtered=cat?_allListings.filter(function(l){return l.category===cat;}):_allListings;
  renderListings(filtered);
}

function updateCatTabs(){
  // Masquer les tabs sans annonces
  document.querySelectorAll('.cat-tab[data-cat]').forEach(function(tab){
    var cat=tab.dataset.cat;
    if(!cat)return;
    var count=_allListings.filter(function(l){return l.category===cat;}).length;
    if(count>0){tab.textContent=tab.textContent.split('(')[0].trim()+' ('+count+')';}
    else{tab.style.display='none';}
  });
}

/* ── CONTACT MODAL ── */
function openContact(){document.getElementById('msgOverlay').classList.add('open');document.body.style.overflow='hidden';}
function closeContact(){document.getElementById('msgOverlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeContact();});

async function sendContact(){
  var name=document.getElementById('msgName').value.trim();
  var email=document.getElementById('msgEmail').value.trim();
  var msg=document.getElementById('msgText').value.trim();
  var alertEl=document.getElementById('msgAlert');
  if(!name||!email||!msg){
    alertEl.style.cssText='display:block;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red);padding:.6rem .9rem;font-size:.78rem;margin-bottom:1rem';
    alertEl.textContent='Remplissez tous les champs.';return;
  }
  if(!email.includes('@')){alertEl.textContent='Email invalide.';return;}
  alertEl.style.cssText='display:block;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);color:var(--green);padding:.6rem .9rem;font-size:.78rem;margin-bottom:1rem';
  alertEl.textContent='✅ Message envoyé ! Le vendeur vous répondra par email.';
  document.getElementById('msgText').value='';
  setTimeout(closeContact,2200);
  showToast('Message envoyé !');
}

/* ── TOAST ── */
var _tt;
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},3000);}
</script>
