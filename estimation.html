<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Estimez gratuitement la valeur de votre aéronef grâce aux annonces récentes sur Aircraft2Sell.">
<meta property="og:title" content="Estimation gratuite — Combien vaut mon avion ? | Aircraft2Sell">
<title>Estimation gratuite — Combien vaut mon avion ? | Aircraft2Sell</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<style>
.est-wrap{max-width:800px;margin:0 auto;padding:3rem 2rem}
.est-form{background:var(--card);border:1px solid var(--border2);padding:2rem;margin-bottom:2rem}
.est-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.fld label{display:block;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);margin-bottom:.4rem}
.inp{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--white);font-family:'DM Sans',sans-serif;font-size:.88rem;padding:.65rem .9rem;outline:none;transition:border-color .2s}
.inp:focus{border-color:rgba(232,160,32,.4)}
.btn-est{width:100%;background:var(--accent);color:var(--deep);border:none;padding:.9rem;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.1em;cursor:pointer;transition:background .2s;margin-top:.5rem}
.btn-est:hover{background:var(--gold)}
.result-box{background:linear-gradient(135deg,rgba(232,160,32,.08),rgba(232,160,32,.03));border:1px solid rgba(232,160,32,.25);padding:2rem;text-align:center;display:none}
.result-range{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:.04em;color:var(--accent);margin-bottom:.5rem}
.result-sub{font-size:.78rem;color:var(--mist);margin-bottom:1.5rem}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-top:2rem;text-align:left}
.comp-card{background:var(--card);padding:.85rem 1rem;cursor:pointer}
.comp-card:hover{background:var(--card2)}
.comp-price{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--accent)}
.comp-name{font-size:.78rem;color:var(--white);margin-bottom:.25rem}
.comp-meta{font-size:.65rem;color:var(--mist2)}
</style>
</head>
<body style="padding-top:64px">
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Estimation gratuite aéronef — Aircraft2Sell</h1>
<!-- nav injectée par nav.js -->

<div class="est-wrap">
  <p style="font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem">OUTIL GRATUIT</p>
  <h2 style="font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,5vw,3.5rem);letter-spacing:.04em;color:var(--white);margin-bottom:.75rem">Combien vaut <em style="font-style:normal;color:var(--accent)">mon avion ?</em></h2>
  <p style="font-size:.88rem;color:var(--mist);max-width:520px;line-height:1.75;margin-bottom:2rem">Estimation basée sur les annonces récentes Aircraft2Sell pour la même catégorie et fourchette d'heures.</p>

  <div class="est-form">
    <div class="est-grid">
      <div class="fld">
        <label>Catégorie</label>
        <select class="inp" id="eCat">
          <option value="">Sélectionner…</option>
          <option value="light">🛩 Avion léger</option>
          <option value="jet">✈ Jet d'affaires</option>
          <option value="turbo">🌀 Turboprop</option>
          <option value="heli">🚁 Hélicoptère</option>
          <option value="ulm">🪂 ULM</option>
        </select>
      </div>
      <div class="fld">
        <label>Marque</label>
        <input type="text" class="inp" id="eMake" placeholder="Ex: Cessna, Piper…">
      </div>
      <div class="fld">
        <label>Année</label>
        <input type="number" class="inp" id="eYear" placeholder="Ex: 2015" min="1950" max="2026">
      </div>
      <div class="fld">
        <label>Heures totales (TT)</label>
        <input type="number" class="inp" id="eHours" placeholder="Ex: 2000">
      </div>
    </div>
    <button class="btn-est" onclick="estimatePrice()">Estimer la valeur →</button>
  </div>

  <div class="result-box" id="resultBox">
    <p style="font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem">ESTIMATION AIRCRAFT2SELL</p>
    <div class="result-range" id="resultRange">—</div>
    <div class="result-sub" id="resultSub">Basé sur X annonces similaires</div>
    <a href="post-listing.html" style="display:inline-block;background:var(--accent);color:var(--deep);text-decoration:none;padding:.75rem 2rem;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em;margin-right:.5rem">Publier mon annonce</a>
    <a href="pricing.html" style="display:inline-block;background:transparent;border:1px solid rgba(232,160,32,.35);color:var(--accent);text-decoration:none;padding:.75rem 2rem;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.1em">Voir les tarifs</a>
    <div id="compListings" class="comp-grid" style="margin-top:2rem"></div>
  </div>
</div>

<script src="analytics.js" defer></script>
<script src="rgpd-consent.js" defer></script>
<script src="nav.js"></script>
<script>
var SB='https://hlivysnlzlqdjcigqgvk.supabase.co';
var SK='sb_publishable_ZxG0uz1u36X-y_JrAs_g6g_CAwFFRSe';
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=String(s);return d.innerHTML;}

async function estimatePrice(){
  var cat=document.getElementById('eCat').value;
  var make=document.getElementById('eMake').value.trim();
  var year=parseInt(document.getElementById('eYear').value)||0;
  var hours=parseInt(document.getElementById('eHours').value)||0;
  if(!cat){alert('Sélectionnez une catégorie');return;}

  var params='status=eq.live&price=not.is.null';
  if(cat)params+='&category=eq.'+encodeURIComponent(cat);
  
  var r=await fetch(SB+'/rest/v1/listings?'+params+'&select=id,make,model,year,hours,price,currency,airport&order=submitted_at.desc&limit=50',{headers:{'apikey':SK}});
  var rows=r.ok?await r.json():[];
  
  /* Filtrer par marque si renseignée */
  if(make){rows=rows.filter(function(l){return(l.make||'').toLowerCase().includes(make.toLowerCase())|| (l.model||'').toLowerCase().includes(make.toLowerCase());});}
  
  /* Filtrer par fourchette d'heures (+/- 50%) */
  if(hours>0){
    var similar=rows.filter(function(l){return l.hours&&Math.abs(l.hours-hours)/hours<0.5;});
    if(similar.length>=2)rows=similar;
  }
  
  /* Filtrer par fourchette d'années (+/- 5 ans) */
  if(year>0){
    var byYear=rows.filter(function(l){return l.year&&Math.abs(l.year-year)<=5;});
    if(byYear.length>=2)rows=byYear;
  }
  
  var box=document.getElementById('resultBox');
  var rng=document.getElementById('resultRange');
  var sub=document.getElementById('resultSub');
  var comp=document.getElementById('compListings');
  
  if(!rows.length){
    box.style.display='block';
    rng.textContent='Données insuffisantes';
    sub.textContent='Pas assez d'annonces similaires sur Aircraft2Sell pour cette catégorie.';
    comp.innerHTML='';
    return;
  }
  
  var prices=rows.map(function(l){return Number(l.price);}).filter(function(p){return p>0;}).sort(function(a,b){return a-b;});
  var min=prices[0];var max=prices[prices.length-1];
  var median=prices[Math.floor(prices.length/2)];
  var low=Math.round(median*0.85);var high=Math.round(median*1.15);
  
  box.style.display='block';
  rng.textContent='€ '+low.toLocaleString('fr-FR')+' — '+high.toLocaleString('fr-FR');
  sub.textContent='Estimation médiane basée sur '+prices.length+' annonce'+(prices.length>1?'s':'')+' similaires';
  
  comp.innerHTML=rows.slice(0,6).map(function(l){
    var title=[l.make,l.model,l.year?'('+l.year+')':''].filter(Boolean).join(' ')||'Aéronef';
    var price='€ '+Number(l.price).toLocaleString('fr-FR');
    return'<div class="comp-card" onclick="location.href='listing.html?id='+l.id+''">'
      +'<div class="comp-name">'+esc(title)+'</div>'
      +'<div class="comp-price">'+price+'</div>'
      +'<div class="comp-meta">'+(l.hours?Number(l.hours).toLocaleString('fr-FR')+' h · ':'')+esc(l.airport||'')+'</div>'
      +'</div>';
  }).join('');
  box.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
