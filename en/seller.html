<script>
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function airportLabel(code){if(!code)return'';var c=String(code).toUpperCase().trim();var ap=(typeof A2S_AIRPORTS!=='undefined')?A2S_AIRPORTS[c]:null;return ap&&ap.name?c+' — '+ap.name:c;}
/* Stable anonymized identifier: never the seller's real name. */
function anonSellerName(seed){
  var s=String(seed||''),h=0;
  for(var i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0;}
  return 'Seller A2S-'+String(Math.abs(h)%10000).padStart(4,'0');
}
var SB='https://hlivysnlzlqdjcigqgvk.supabase.co';
var SK='sb_publishable_ZxG0uz1u36X-y_JrAs_g6g_CAwFFRSe';
async function sbGet(t,p){try{var r=await fetch(SB+'/rest/v1/'+t+(p?'?'+p:''),{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});return r.ok?await r.json():[];}catch(e){return[];}}

/* Public seller profile: goes through the get_seller_public() function,
   which never returns the email and prevents enumerating members with the
   site's public key. Falls back to direct read until the SQL
   (supabase/fuite-users.sql) is applied. */
async function sbSellerPublic(email){
  if(!email) return null;
  try{
    var r=await fetch(SB+'/rest/v1/rpc/get_seller_public',{
      method:'POST',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},
      body:JSON.stringify({p_email:email})
    });
    if(r.ok){
      var d=await r.json();
      if(Array.isArray(d)) return d.length?d[0]:null;
      if(d&&d.name!==undefined) return d;
      return null;
    }
  }catch(e){}
  try{
    var rows=await sbGet('users','email=eq.'+encodeURIComponent(email)+'&select=name,pseudo,certified,is_pro,seller_type,company,rating,plan,registered_at,bio&limit=1');
    return (rows&&rows.length)?rows[0]:null;
  }catch(e){ return null; }
}
/* A seller's listings, without exposing their email (GDPR): same pattern
   as sbSellerPublic(), receives the email only as an input parameter. */
async function sbSellerListings(email){
  if(!email) return [];
  try{
    var r=await fetch(SB+'/rest/v1/rpc/get_seller_listings',{
      method:'POST',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},
      body:JSON.stringify({p_email:email})
    });
    if(r.ok) return await r.json();
  }catch(e){}
  /* Fail-safe fallback: if the RPC fails, NEVER fall back to the raw
     'listings' table (would expose seller_email/seller_phone to an
     anonymous visitor). Return an empty list rather than leak personal data. */
  return [];
}
/* Variants by pseudo — the seller's public identifier, never the email.
   seller.html now builds its links with ?pseudo=... */
async function sbSellerPublicByPseudo(pseudo){
  if(!pseudo) return null;
  try{
    var r=await fetch(SB+'/rest/v1/rpc/get_seller_public_by_pseudo',{
      method:'POST',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},
      body:JSON.stringify({p_pseudo:pseudo})
    });
    if(r.ok){
      var d=await r.json();
      if(Array.isArray(d)) return d.length?d[0]:null;
      if(d&&d.name!==undefined) return d;
      return null;
    }
  }catch(e){}
  return null;
}
async function sbSellerListingsByPseudo(pseudo){
  if(!pseudo) return [];
  try{
    var r=await fetch(SB+'/rest/v1/rpc/get_seller_listings_by_pseudo',{
      method:'POST',
      headers:{'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'},
      body:JSON.stringify({p_pseudo:pseudo})
    });
    if(r.ok) return await r.json();
  }catch(e){}
  return [];
}

function countryLabel(code){if(!code)return'';return COUNTRY_NAMES[code]||code;}
function optimizeImg(url,w){if(!url)return null;return url+(url.includes('?')?'&':'?')+'width='+(w||400)+'&quality=80&format=webp';}
function setAlert(el,type,msg){if(!el)return;el.className='alert alert-'+type;el.style.display='';el.innerHTML=A2SIcon(type==='success'?'check-circle':'alert-triangle')+'<span>'+esc(msg)+'</span>';}
function hideAlert(el){if(el){el.style.display='none';el.innerHTML='';}}
function starsHtml(n,size){var h='<span class="review-stars">';for(var i=1;i<=5;i++)h+='<span class="'+(i<=n?'on':'')+'">'+A2SIcon('star')+'</span>';return h+'</span>';}

var _allListings=[],_sellerEmail='',_sellerName='',_sellerPseudo='';

/* ── BOOT ── */
window.addEventListener('DOMContentLoaded',async function(){
  var params=new URLSearchParams(location.search);
  var pseudoParam=params.get('pseudo')||'';
  _sellerEmail=params.get('email')||'';
  var sellerNameParam=params.get('name')||'';

  if(!pseudoParam&&!_sellerEmail){
    document.getElementById('listingsWrap').innerHTML='<div class="card"><div class="empty-state"><span class="icon-box">'+A2SIcon('user')+'</span><div class="empty-title">Seller not found</div><p class="empty-sub">This link does not point to any seller. Browse listings to find a seller.</p><a class="btn-primary" href="search.html" style="margin-top:.5rem">'+A2SIcon('search')+'View listings</a></div></div>';
    document.getElementById('sellerName').textContent='Unknown seller';
    document.getElementById('catTabs').style.display='none';
    return;
  }

  /* Seller profile via RPC: never returns the email, and prevents
     enumerating members with the site's public key.
     ?pseudo= takes priority (public identifier, new links);
     ?email= remains supported for links already shared/indexed before
     this fix (GDPR, audit of 18/09). */
  var _sp, rows;
  if(pseudoParam){
    _sellerPseudo=pseudoParam;
    _sp=await sbSellerPublicByPseudo(pseudoParam);
    rows=await sbSellerListingsByPseudo(pseudoParam);
  }else{
    _sp=await sbSellerPublic(_sellerEmail);
    rows=await sbSellerListings(_sellerEmail);
    if(_sp&&_sp.pseudo)_sellerPseudo=_sp.pseudo;
  }
  var userData=_sp?[_sp]:[];
  var user=userData&&userData[0]?userData[0]:null;

  _allListings=rows||[];
  /* As soon as we know the pseudo (via direct ?pseudo= or resolved from
     the profile), fix the URL shown in the address bar without
     reloading the page — so that any link copied/shared from now on is
     a pseudo-based link, never an email-based one. */
  if(_sellerPseudo&&window.history&&window.history.replaceState){
    var newUrl='seller.html?pseudo='+encodeURIComponent(_sellerPseudo)+(sellerNameParam?'&name='+encodeURIComponent(sellerNameParam):'');
    window.history.replaceState(null,'',newUrl);
  }

  renderProfile(user,sellerNameParam);
  renderListings(_allListings);
  updateCatTabs();
  loadReviews(_sellerPseudo,_sellerEmail);

  var loggedIn=localStorage.getItem('a2s_logged_in')==='true';
  var tk=sessionStorage.getItem('a2s_auth_token');
  if(loggedIn||tk){
    var userEmail=sessionStorage.getItem('a2s_auth_token')&&(function(){try{return JSON.parse(atob(sessionStorage.getItem('a2s_auth_token').split('.')[1])).email;}catch(e){return '';}})();
    if(userEmail){document.getElementById('msgEmail').value=userEmail;}
    var n=localStorage.getItem('a2s_user_name');if(n)document.getElementById('msgName').value=n;
  }
});

/* ── PROFILE ── */
function renderProfile(user,fallbackName){
  /* Display priority: company (pro accounts) > public pseudo >
     stable anonymized identifier. The real name (user.name) is NEVER
     displayed — that was the reported bug: it previously only served as
     a fallback, exposing the civil identity of non-pseudonymized sellers. */
  var isPro=user&&user.is_pro;
  var name=(isPro&&user.company)||(user&&user.pseudo)||anonSellerName(_sellerEmail||fallbackName||'seller');
  var pseudo=user&&user.pseudo&&isPro&&user.company?'@'+user.pseudo:'';
  _sellerName=name;

  document.getElementById('sellerAvatar').textContent=(name[0]||'S').toUpperCase();
  document.getElementById('sellerName').textContent=name;
  document.getElementById('sellerNameTitle').textContent=name;
  document.title='Aircraft2Sell — Profile of '+name;
  if(pseudo)document.getElementById('sellerPseudo').textContent=pseudo;

  var since=user&&user.registered_at
    ?'Member since '+new Date(user.registered_at).toLocaleDateString('en-GB',{month:'long',year:'numeric'})
    :(_allListings.length&&_allListings[_allListings.length-1].submitted_at
      ?'Active since '+new Date(_allListings[_allListings.length-1].submitted_at).toLocaleDateString('en-GB',{month:'long',year:'numeric'})
      :'');
  document.getElementById('sellerSince').textContent=since;

  /* Badges */
  var badges='';
  var isCertified=user&&user.certified;
  var isPro=user&&user.is_pro;
  var sellerType=user&&user.seller_type;
  var plan=user&&user.plan;
  if(isPro){
    badges+='<span class="badge badge-navy">'+A2SIcon('building')+'Verified professional</span>';
  }else{
    var typeMap={particulier:['user','Private seller'],broker:['briefcase','Broker'],club:['users','Flying club'],acheteur:['search','Buyer']};
    if(sellerType&&typeMap[sellerType]){
      badges+='<span class="badge">'+A2SIcon(typeMap[sellerType][0])+typeMap[sellerType][1]+'</span>';
    }
  }
  badges+=isCertified?'<span class="badge-verified">Verified identity</span>':'<span class="badge-verified">Verified seller</span>';
  if(plan==='Pro')badges+='<span class="badge badge-accent">'+A2SIcon('award')+'Pro</span>';
  else if(plan==='Aviateur')badges+='<span class="badge badge-accent">Aviator</span>';
  document.getElementById('sellerBadges').innerHTML=badges;

  /* Rating */
  var rating=user&&user.rating?parseInt(user.rating):0;
  document.querySelectorAll('#sellerStars .star').forEach(function(s,i){s.classList.toggle('on',i<rating);});
  if(!rating)document.getElementById('sellerStars').style.display='none';

  /* Bio: shown if filled in, otherwise hidden. */
  var bioEl=document.getElementById('sellerBio');
  if(bioEl){
    if(user&&user.bio&&String(user.bio).trim()){
      bioEl.style.display='';
      bioEl.innerHTML='<div class="profile-bio-title">About</div><div class="profile-bio-text">'+esc(user.bio)+'</div>';
    }else{
      bioEl.style.display='none';
      bioEl.innerHTML='';
    }
  }

  /* Stats */
  var totalViews=_allListings.reduce(function(s,l){return s+(l.views||0);},0);
  document.getElementById('statListings').textContent=_allListings.length;
  document.getElementById('statViews').textContent=totalViews>999?(Math.round(totalViews/100)/10)+'k':totalViews;

  /* Information */
  var info='';
  var airport=(user&&user.airport)||(_allListings.length&&_allListings[0].airport)||'';
  if(airport)info+='<div class="pi-row">'+A2SIcon('map-pin')+'<span class="pi-val">'+airportLabel(airport)+'</span></div>';
  var countryCode=(user&&user.country)||(_allListings.length&&_allListings[0].country)||'';
  if(countryCode)info+='<div class="pi-row">'+A2SIcon('globe')+'<span class="pi-val">'+esc(countryLabel(countryCode))+'</span></div>';
  if(user&&user.company)info+='<div class="pi-row">'+A2SIcon('building')+'<span class="pi-val">'+esc(user.company)+'</span></div>';
  if(user&&user.phone)info+='<div class="pi-row">'+A2SIcon('phone')+'<span class="pi-val"><a href="tel:'+esc(user.phone)+'">'+esc(user.phone)+'</a></span></div>';
  if(isPro)info+='<div class="alert alert-info" style="margin:.6rem 0 .2rem">'+A2SIcon('shield-check')+'<span>This seller is a <strong>professional verified</strong> by Aircraft2Sell.</span></div>';
  if(!info)info='<div class="pi-empty">This seller has not provided any additional information.</div>';
  document.getElementById('sellerInfo').innerHTML=info;
}

/* ── LISTINGS ── */
function fmtPrice(p,c){var s={EUR:'€',USD:'$',GBP:'£',CHF:'Fr',CAD:'CA$',AUD:'AU$',AED:'AED '}[c||'EUR']||'€';var n=p&&!isNaN(Number(p))?Number(p):null;return n?n.toLocaleString('en-GB')+' '+s:'Price on request';}
function renderListings(listings){
  var wrap=document.getElementById('listingsWrap');
  var countEl=document.getElementById('listingCount');
  if(countEl)countEl.textContent=listings.length+' listing'+(listings.length>1?'s':'');

  if(!listings.length){
    wrap.innerHTML='<div class="card"><div class="empty-state"><span class="icon-box">'+A2SIcon('plane')+'</span><div class="empty-title">No active listings</div><p class="empty-sub">This seller has no published listing in this category right now. Create an <a href="alerts.html">alert</a> to be notified.</p><a class="btn-secondary" href="search.html" style="margin-top:.5rem">View all listings</a></div></div>';
    return;
  }
  wrap.innerHTML='<div class="listings-grid">'+listings.map(function(l){
    var title=esc([l.make,l.model,l.year?'('+l.year+')':''].filter(Boolean).join(' ')||'Listing');
    var cat=CAT_LABELS[l.category]||l.category||'';
    var photo=l.photos&&l.photos[0]
      ?'<img src="'+esc(optimizeImg(l.photos[0],600))+'" alt="'+title+'" loading="lazy">'
      :'<span class="lc-placeholder">'+A2SIcon(CAT_ICON[l.category]||'plane')+'</span>';
    var loc=l.airport?airportLabel(l.airport):(countryLabel(l.country)||'—');
    return '<a class="lc" href="listing.html?id='+encodeURIComponent(l.id)+'">'
      +'<div class="lc-img">'+photo+(cat?'<span class="lc-cat-badge">'+esc(cat)+'</span>':'')+'</div>'
      +'<div class="lc-body"><div class="lc-title">'+title+'</div>'
      +'<div class="lc-specs">'+(l.year?'<span class="lc-spec">'+A2SIcon('calendar')+esc(l.year)+'</span>':'')+(l.hours?'<span class="lc-spec">'+A2SIcon('clock')+Number(l.hours).toLocaleString('en-GB')+' h</span>':'')+'</div>'
      +'<div class="lc-trust"><span class="badge badge-success badge-dot">Live</span></div>'
      +'<div class="lc-footer"><div class="lc-price">'+fmtPrice(l.price,l.currency)+'</div><div class="lc-loc">'+A2SIcon('map-pin')+loc+'</div></div>'
      +'</div></a>';
  }).join('')+'</div>';
}

/* ── CATEGORY FILTERS ── */
var _currentCat='';
function filterCat(btn,cat){
  _currentCat=cat;
  document.querySelectorAll('#catTabs .tab').forEach(function(t){t.classList.remove('active');t.setAttribute('aria-selected','false');});
  btn.classList.add('active');btn.setAttribute('aria-selected','true');
  var filtered=cat?_allListings.filter(function(l){return l.category===cat;}):_allListings;
  renderListings(filtered);
}

function updateCatTabs(){
  document.querySelectorAll('#catTabs .tab[data-cat]').forEach(function(tab){
    var cat=tab.dataset.cat;
    if(!cat)return;
    var count=_allListings.filter(function(l){return l.category===cat;}).length;
    if(count>0){tab.textContent=tab.textContent.split('(')[0].trim()+' ('+count+')';}
    else{tab.style.display='none';}
  });
}

/* ── CONTACT MODAL ── */
function openContact(){hideAlert(document.getElementById('msgAlert'));document.getElementById('msgOverlay').classList.add('open');document.body.style.overflow='hidden';var f=document.getElementById('msgText');if(f)setTimeout(function(){f.focus();},50);}
function closeContact(){document.getElementById('msgOverlay').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeContact();closeReview();}});

async function sendContact(){
  var name=document.getElementById('msgName').value.trim();
  var email=document.getElementById('msgEmail').value.trim().toLowerCase();
  var msg=document.getElementById('msgText').value.trim();
  var alertEl=document.getElementById('msgAlert');
  if(!name||!email||!msg){setAlert(alertEl,'error','Please enter your name, your email and your message.');return;}
  if(!email.includes('@')){setAlert(alertEl,'error','This email address looks invalid.');return;}
  if(_sellerEmail&&email===_sellerEmail.toLowerCase()){setAlert(alertEl,'error','You cannot send a message to yourself.');return;}
  var btn=document.querySelector('#msgOverlay .btn-primary');
  if(btn){btn.disabled=true;btn.classList.add('is-loading');}
  try{
    var r=await fetch('/api/notify?type=message',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        senderEmail:email,senderName:name,message:msg,
        receiverEmail:_sellerEmail||undefined,
        sellerPseudo:_sellerEmail?undefined:_sellerPseudo
      })
    });
    var d=await r.json().catch(function(){return{};});
    if(!r.ok){setAlert(alertEl,'error',d.error||'Unable to send right now.');return;}
    setAlert(alertEl,'success','Message sent. The seller will reply by email.');
    document.getElementById('msgText').value='';
    setTimeout(closeContact,2200);
    showToast('Message sent');
  }catch(e){
    setAlert(alertEl,'error','Unable to send: check your connection.');
  }finally{
    if(btn){btn.disabled=false;btn.classList.remove('is-loading');}
  }
}

/* ── TOAST ── */
var _tt;
function showToast(msg){var el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove('show');},3000);}

/* ── REVIEWS ── */
var _reviewStar=0;
function setReviewStar(n){
  _reviewStar=n;
  document.querySelectorAll('.sp-star').forEach(function(s,i){s.classList.toggle('on',i<n);});
}
function openReview(){
  var loggedIn=localStorage.getItem('a2s_logged_in')==='true';
  if(!loggedIn){showToast('Log in to leave a review');setTimeout(function(){window.location.href='login.html?redirect='+encodeURIComponent('seller.html'+location.search);},1200);return;}
  document.getElementById('reviewName').value=localStorage.getItem('a2s_user_name')||'';
  document.getElementById('reviewText').value='';
  _reviewStar=0;
  hideAlert(document.getElementById('reviewAlert'));
  document.querySelectorAll('.sp-star').forEach(function(s){s.classList.remove('on');});
  document.getElementById('reviewOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeReview(){
  var el=document.getElementById('reviewOverlay');
  if(el&&el.classList.contains('open')){el.classList.remove('open');document.body.style.overflow='';}
}
function submitReview(){
  var al=document.getElementById('reviewAlert');
  if(!_reviewStar){setAlert(al,'error','Select a rating from 1 to 5 stars.');return;}
  var name=(document.getElementById('reviewName')||{value:''}).value.trim();
  var text=(document.getElementById('reviewText')||{value:''}).value.trim();
  if(!name){setAlert(al,'error','Please enter your name.');return;}
  if(!text){setAlert(al,'error','Write a comment to go with your rating.');return;}
  if(text.length>1000){setAlert(al,'error','Comment too long (1000 characters maximum).');return;}
  var authorEmail='';
  var tk=sessionStorage.getItem('a2s_auth_token');
  if(tk){try{authorEmail=JSON.parse(atob(tk.split('.')[1])).email||'';}catch(e){authorEmail='';}}
  setAlert(al,'success','Sending your review…');
  fetch('/api/forms?kind=testimonial',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({listing_id:null,seller_pseudo:_sellerPseudo,seller_email:_sellerPseudo?undefined:_sellerEmail,author_name:name,author_email:authorEmail,rating:_reviewStar,comment:text})
  }).then(function(r){return r.json().then(function(d){return {ok:r.ok,d:d};});})
    .then(function(res){
      if(res.ok&&res.d&&res.d.ok){closeReview();showToast('Thank you! Your review will be published after moderation.');}
      else{setAlert(al,'error',(res.d&&res.d.error)||'An error occurred, please try again later.');}
    })
    .catch(function(){setAlert(al,'error','An error occurred, please try again later.');});
}
function loadReviews(sellerPseudo,sellerEmail){
  var section=document.getElementById('reviewsSection');
  var list=document.getElementById('reviewsList');
  var btn=document.getElementById('btnWriteReview');
  if(!section||!list)return;
  section.style.display='';
  var loggedIn=localStorage.getItem('a2s_logged_in')==='true';
  if(btn)btn.style.display=loggedIn?'':'none';
  list.innerHTML='<p class="pi-empty">Loading reviews…</p>';
  var qs=sellerPseudo?('kind=testimonial&seller_pseudo='+encodeURIComponent(sellerPseudo)):('kind=testimonial&seller_email='+encodeURIComponent(sellerEmail||''));
  fetch('/api/forms?'+qs)
    .then(function(r){return r.ok?r.json():[];})
    .catch(function(){return[];})
    .then(function(reviews){
      if(!reviews||!reviews.length){
        list.innerHTML='<p class="pi-empty">No reviews yet.'+(loggedIn?' ':' <a href="login.html" style="color:var(--a2s-blue);font-weight:700">Log in</a> to be the first to leave one.')+'</p>';
        return;
      }
      var avg=reviews.reduce(function(s,r){return s+Number(r.rating||0);},0)/reviews.length;
      list.innerHTML='<div class="review-avg">'+starsHtml(Math.round(avg))+'<strong style="color:var(--a2s-navy)">'+avg.toFixed(1)+'/5</strong><span>('+reviews.length+' reviews)</span></div>'
        +reviews.slice(0,10).map(function(r){
          return '<div class="review-item">'
            +'<div class="review-meta">'+starsHtml(Number(r.rating)||0)+'<span class="review-author">'+esc(r.author_name)+'</span><span class="review-date">'+(r.created_at?new Date(r.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'')+'</span></div>'
            +'<div class="review-text">'+esc(r.comment)+'</div>'
            +'</div>';
        }).join('');
    });
}
